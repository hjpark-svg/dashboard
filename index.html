<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 대시보드</title>
<style>
body{font-family:sans-serif;padding:16px;background:#f5f6f7;max-width:720px;margin:auto}
h1{font-size:20px}
textarea,input{width:100%;padding:10px;font-size:15px;box-sizing:border-box;margin-top:6px}
textarea{height:100px}
button{padding:10px 14px;font-size:15px;margin:8px 6px 0 0}
.card{background:#fff;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap;word-break:break-all}
.time{color:#888;font-size:12px}
#status{margin-top:8px;font-size:13px;color:#555}
.box{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px}
.hide{display:none}
</style></head><body>
<h1>AI 대시보드</h1>

<div id="setup" class="box hide">
<b>처음 1번만: 토큰 붙여넣기</b>
<input id="tok" type="password" placeholder="github_pat_로 시작하는 토큰">
<button onclick="setup()">연결하기</button>
</div>

<div id="main" class="hide">
<textarea id="memo" placeholder="메모를 입력하세요"></textarea>
<button onclick="add()">저장</button>
<button onclick="pull()">새로고침</button>
<button onclick="phoneLink()">휴대폰 연결 링크 복사</button>
<button onclick="reset()">연결 해제</button>
</div>
<div id="status"></div>
<div id="list"></div>

<script>
const F='memos.json';
let memos=[];
const $=id=>document.getElementById(id);
const get=k=>localStorage.getItem(k)||'';
function st(s){$('status').textContent=s}

(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('t')&&h.get('g')){
    localStorage.setItem('tok',h.get('t'));localStorage.setItem('gid',h.get('g'));
    history.replaceState(null,'',location.pathname+location.search);
  }
})();

async function gh(path,method,body){
  const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+get('tok'),'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function setup(){
  const t=$('tok').value.trim();if(!t)return;
  localStorage.setItem('tok',t);
  try{
    st('연결 중...');
    const j=await gh('/gists','POST',{description:'AI dashboard memos',public:false,files:{[F]:{content:'[]'}}});
    localStorage.setItem('gid',j.id);
    start();
  }catch(e){localStorage.removeItem('tok');st('연결 실패: '+e.message+' (토큰의 Gists 권한을 확인하세요)')}
}
function render(){
  $('list').innerHTML='';
  memos.slice().reverse().forEach(m=>{
    const d=document.createElement('div');d.className='card';
    const t=document.createElement('div');t.className='time';t.textContent=new Date(m.t).toLocaleString('ko-KR');
    const b=document.createElement('div');b.textContent=m.text;
    const x=document.createElement('button');x.textContent='삭제';x.onclick=()=>del(m.id);
    d.append(t,b,x);$('list').append(d);
  });
}
async function pull(){
  try{
    st('불러오는 중...');
    const j=await gh('/gists/'+get('gid'),'GET');
    const f=j.files[F];
    memos=f&&f.content?JSON.parse(f.content):[];
    render();st('동기화 완료 ('+memos.length+'개)');
  }catch(e){st('불러오기 실패: '+e.message)}
}
async function push(){
  try{st('저장 중...');await gh('/gists/'+get('gid'),'PATCH',{files:{[F]:{content:JSON.stringify(memos)}}});st('저장 완료')}
  catch(e){st('저장 실패: '+e.message)}
}
async function add(){
  const v=$('memo').value.trim();if(!v)return;
  await pull();
  memos.push({id:Date.now(),t:new Date().toISOString(),text:v});
  $('memo').value='';render();await push();
}
async function del(id){
  if(!confirm('삭제할까요?'))return;
  await pull();
  memos=memos.filter(m=>m.id!==id);render();await push();
}
function phoneLink(){
  const u=location.origin+location.pathname+'#t='+encodeURIComponent(get('tok'))+'&g='+encodeURIComponent(get('gid'));
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>st('복사됨. 휴대폰으로 보내서 여세요 (이 링크는 남에게 공유 금지)')).catch(()=>prompt('이 링크를 복사하세요',u));
}
function reset(){if(confirm('이 기기의 연결을 해제할까요?')){localStorage.removeItem('tok');localStorage.removeItem('gid');location.reload()}}
function start(){
  if(get('tok')&&get('gid')){$('setup').classList.add('hide');$('main').classList.remove('hide');pull()}
  else{$('setup').classList.remove('hide');$('main').classList.add('hide')}
}
start();
</script></body></html>
